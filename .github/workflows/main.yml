name: Astro Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync missing permalinks
        run: pnpm run permalink:sync

      - name: Build site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        env:
          GIT_NAME: FA
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          REPO: github.com/lingrottin/FarawayAsh.git
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global init.defaultBranch cf_web
          cd ./dist && git init && git add -A
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
          git commit -m "Site deployed by GitHub Actions"
          git push --force "https://$GH_TOKEN@$REPO" cf_web:cf_web
